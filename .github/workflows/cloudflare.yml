# Mise en ligne automatique sur Cloudflare Pages à chaque envoi sur main.
# Secrets GitHub requis : CLOUDFLARE_API_TOKEN, AI_API_KEY, ACCESS_CODE.
name: Mise en ligne Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
      WRANGLER: npx --yes wrangler@3.114.0
      PROJECT: speak-american
    steps:
      - name: Jeton présent ?
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Secret CLOUDFLARE_API_TOKEN absent : rien à déployer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Préparer le site
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir dist
          cp -r index.html css js icons manifest.webmanifest sw.js _headers dist/

      - name: Créer le projet (première fois seulement)
        if: steps.check.outputs.ok == 'true'
        run: $WRANGLER pages project create "$PROJECT" --production-branch main || true

      - name: Clés du serveur
        if: steps.check.outputs.ok == 'true'
        run: |
          [ -n "$AI_API_KEY" ] && printf '%s' "$AI_API_KEY" | $WRANGLER pages secret put AI_API_KEY --project-name "$PROJECT"
          [ -n "$ACCESS_CODE" ] && printf '%s' "$ACCESS_CODE" | $WRANGLER pages secret put ACCESS_CODE --project-name "$PROJECT"
          true

      - name: Déployer
        if: steps.check.outputs.ok == 'true'
        run: $WRANGLER pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
